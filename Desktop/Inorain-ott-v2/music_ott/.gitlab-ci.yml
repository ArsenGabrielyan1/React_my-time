stages:
    - CREATE_DOCKER_IMAGE
    - DEPLOY

BUILDING IMAGE:
    stage: CREATE_DOCKER_IMAGE
    only:
       - master
    script:
        - docker build -t "$CI_DOCKER_IMAGE" .
    tags:
        - ott-tv-v2-react-music

DEPLOY:
    stage: DEPLOY
    only:
       - master
    before_script:
      - docker login -u "$CI_REGISTERY_USER" -p "$CI_REGISTERY_PASSWORD"
    script:
        - docker push "$CI_DOCKER_IMAGE"
    after_script:
        - docker logout
        - docker rmi "$CI_DOCKER_IMAGE"

    tags:
        - ott-tv-v2-react-music
